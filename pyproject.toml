# Tool configs only. Dependencies live in requirements.txt (pip-based, no uv).
# If the project migrates to uv, add a [project] section here.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
